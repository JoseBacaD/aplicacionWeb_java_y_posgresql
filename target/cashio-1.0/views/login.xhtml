<?xml version='1.0' encoding='UTF-8' ?> 
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    
    

    <h:head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <h:outputStylesheet name="./css/materialize.css"/>
         <!--<h:outputStylesheet name="./css/login-fondo.css"/>-->
        <!--<h:outputStylesheet name="./css/font-awesome.min.css"/>-->
        <!--<h:outputScript name="./js/jquery-3.1.1.min.js"/>-->
         <h:outputStylesheet name="/css/icofont.min.css"/> 
        <h:outputScript name="./js/materialize.min.js"/>
        <h:outputStylesheet name="/css/custom-materialize.css"/>

        <!--Let browser know website is optimized for mobile-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <head>
        
        <title>Aristra </title>
        <link rel="shortcut icon" type="image/x-icon" href="#{request.contextPath}/resources/images/quill-img.ico"/>
    </head>
    </h:head>

    <h:body class="blue-grey darken-2">
        
       

        <div class="imgfondo">
            
            
        
         <div class="valign-wrapper purple-text darken-4">
           <div class="container ">
               <div class="row center-align flow-text">
                   
                   
                       </div>
        
                <div class="center-align">
                    
                    <div class="row">
                        <div class="col s12 m10 l8 offset-m1 offset-l2">    
                            <div class="card" style="opacity: .90;  ">
                                <div class="card-content">
                                    
                                    <h4 class="light-blue-text text-darken-2"  style="letter-spacing: -10px" >
                                        <i class="icofont-compass-alt-3 icofont-2x light-blue-text text-darken-4"/> <span style="letter-spacing: 1px !important">RISTRA</span>
                                        </h4>
                                    
                        
                                </div>
                                <h:form id="login-form">
                                <div class="container">
                                    <div class="left-align">
                                        <div class="row">
                                            <div class="input-field col s12 ">
                                                <h:inputText  id="user" 
                                                              value="#{loginSession.usr.userAlias}"
                                                              required="true"
                                                              requiredMessage="Requerido"/>
                                                
                                                <label for="user" ><i class="icofont-ui-user"></i> Usuario</label>
                                                <h:messages for="user" class="red-text"/>
                                                    
                                            
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="input-field col s12">
                                                
                                                    <h:inputSecret id="pwd"
                                                                   
                                                                   value="#{loginSession.usr.user_password}"
                                                                   required="true"
                                                                   requiredMessage="Requerido"/>
                                                    <label for="pwd" > <i class="icofont-key"></i> Contraseña</label>
                                                     <h:messages for="pwd" class="red-text"/>
                                            </div>
                                        </div>
                                        
<!--                                        <div class="row">
                                            <div class="col s12"> 
                                                <p:captcha id="captcha" label="Captcha"/>
                                            </div>
                                        </div>
                                        -->
                                        
                                    </div>
                                    <div class="row">
                                        <div class="input-field col s12">
                                            <p:commandLink  styleClass="btn waves-effect waves-light"                                                          
                                                     style="width: 100%; height:40px;
                                                            text-decoration: none;
                                                            color: white;"
                                                     action="#{loginSession.callMainProcess}"
                                                     ajax ="false"
                                                     update="answerpanel login-form"    
                                                      oncomplete="$('#CRUDModal').modal('open'); updateInputs();">
                                                
                                              <i class="icofont-login"></i> Entrar 
                                                
                                               
                                            </p:commandLink>
                                        </div>
                                                
                                    </div>
                                    <div class="row">
                                        
                                        
                                    </div>
                                </div>
                                     
  
                              </h:form>
                            </div>
                            
                            
                            <p class="white-text">  Acceso restringido</p>
                           
                                
                            </div>
                            
                        
                        </div>
                    
                    
                          
            </div>
            
        </div>
            
            
        </div>
        </div>
        
        <div id="modal1" class="modal">
            <div class="row">
                <div class=" col s12 center-align"  >
            <h:panelGroup id="answerpanel">
    <div class="modal-content">
      
        <h5>#{loginSession.answerMessage}</h5>
    </div>
    <div class="modal-footer center-align">
        <div class="row" style="width: 99%; margin-left: 0px">
            <div class="col s12 m6 l6 offset-m3 offset-l3">
                  <a  class="btn waves-effect modal-action modal-close" style="width: 100%;">Aceptar</a>
            </div>
        </div>
        </div>
                </h:panelGroup>
                    </div>
                
        </div>
  </div>
        
        <script>
                    $(document).ready(function(){
    // the "href" attribute of .modal-trigger must specify the modal ID that wants to be triggered
    $('.modal').modal();
  });


function updateInputs(){
                 $(document).ready(function() {
                 M.updateTextFields();
                 
                 });
                
            }
            
                     
     initModal();
    function initModal(){
            $(document).ready(function () {
                // the "href" attribute of .modal-trigger must specify the modal ID that wants to be triggered
                $('.modal').modal({
      dismissible: true, // Modal can be dismissed by clicking outside of the modal
      opacity: .5, // Opacity of modal background
      inDuration: 300, // Transition in duration
      outDuration: 200, // Transition out duration
      startingTop: '4%', // Starting top style attribute
      endingTop: '10%', // Ending top style attribute
      preventScrolling: true
          }
  );
            });
            
            
}
               
                </script>
    </h:body>

</html>
