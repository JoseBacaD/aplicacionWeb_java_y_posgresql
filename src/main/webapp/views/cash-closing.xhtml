<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <body>

        <ui:composition template="./parentTemplate.xhtml">

            <ui:define name="content">
                <f:metadata>
                     <f:event type="preRenderView" listener="#{cashClosingBean.onPageLoad}"/>
               </f:metadata>
                <p:ajaxStatus  onstart="$('#processing').modal('open');" onsuccess="$('#processing').modal('close');" />
            
        
            <h:form id="cashClosingForm">
                <h:panelGroup id="cashClosingPanel"> 
                   <p:focus context="cashClosingPanel"/>
                    <div class="row" style="margin-bottom: 0px;" >
                        <div class="col s12">
                            <div class="card " style="margin-bottom: 0px;" >
                                <div class="card-content">
                                    <h5><i class="fas fa-funnel-dollar"/> Corte de caja</h5>

                                    <div class="row">

                                        <div class="col s12 m6 l6 offset-l3 offset-m3 input-field">
                                            <p:inputText
                                                
                                                id="filter1"
                                                required="true"
                                                
                                                value = "#{cashClosingBean.selectedCashClosing.cashCount}"
                                                requiredMessage="#{bundle.validationmessagereguired}"
                                                converterMessage="#{bundle.validationmessagenumeric}"
                                                validatorMessage="Mayor a cero y máx 8 dígitos">
                                                <f:validateLongRange minimum="0" />
                                                <f:validateLength maximum="8" />
                                               
                                            </p:inputText>
                                            <h:messages class="red-text" for="filter1"/>
                                            <label for="filter1" >Efectivo</label> 

                                        </div>
                                        
                                         <div class="col s12 m6 l6 offset-l3 offset-m3 input-field">
                                            <p:inputText
                                                
                                                id="filter2"
                                                required="true"
                                                
                                                value = "#{cashClosingBean.selectedCashClosing.dollarCount}"
                                                requiredMessage="#{bundle.validationmessagereguired}"
                                                converterMessage="#{bundle.validationmessagenumeric}"
                                                validatorMessage="Mayor a cero y máx 8 dígitos">
                                                <f:validateLongRange minimum="0" />
                                                <f:validateLength maximum="8" />
                                            </p:inputText>
                                            <h:messages class="red-text" for="filter2"/>
                                            <label for="filter2" >Dolares</label> 

                                        </div>

                                    </div>

                                    <div class="row">
                                        <div class="col s12 m4 l4 offset-l4 offset-m4 " >                        
                                            <p:commandLink action="#{cashClosingBean.callMainProcess}"
                                                           styleClass="btn waves-effect waves-light "
                                                           style="width: 100%; text-decoration: none;
                                                                  color: white;"
                                                           update="finishedProcessPanel cashClosingForm"

                                                           oncomplete="updateInputs();"
                                                           >

                                                <i class="icofont-save"></i> Guardar
                                            </p:commandLink> 
                                        </div>



                                    </div>
                                </div>
                            </div>

                        </div>

                    </div>

                </h:panelGroup>
                </h:form>

                
              
                
                <div id="answerModal" class="modal bottom-sheet">
                    <h:panelGroup id="finishedProcessPanel">
                        <div class="modal-content center-align black-text">
                            <h5>#{bundle['modal.updtcreate.confirm']}</h5>

                            <h6>#{cashClosingBean.answerMessage}</h6>
                        </div>
                        <div class="modal-footer">
                            <div class="row" style="width: 99%; margin-left: 0px">
                                <div class="col s12 m6 l6 offset-m3 offset-l3">
                                     
                                    <a class="modal-action modal-close waves-effect waves-light btn" style="width: 100%; text-decoration: none; color:white">
                                        <i class="icofont-check-alt"></i> Aceptar</a>  
                                </div>
                            </div>
                        </div>
                    </h:panelGroup>
                </div>
                
                <script>
     initModal();
    function initModal(){
            $(document).ready(function () {
                // the "href" attribute of .modal-trigger must specify the modal ID that wants to be triggered
                $('.modal').modal({
      dismissible: true, // Modal can be dismissed by clicking outside of the modal
      opacity: .5, // Opacity of modal background
      inDuration: 300, // Transition in duration
      outDuration: 200, // Transition out duration
      startingTop: '4%', // Starting top style attribute
      endingTop: '10%', // Ending top style attribute
      preventScrolling: true
          }
  );
            });
            
            
}
initProcessing();
    function initProcessing(){
            $(document).ready(function () {
                // the "href" attribute of .modal-trigger must specify the modal ID that wants to be triggered
                $('#processing').modal({
      dismissible: false, // Modal can be dismissed by clicking outside of the modal
      opacity: 0, // Opacity of modal background
      inDuration: 300, // Transition in duration
      outDuration: 200, // Transition out duration
      startingTop: '4%', // Starting top style attribute
      endingTop: '10%', // Ending top style attribute
      preventScrolling: true
          }
  );
            });
            
            
}

$('#answerModal').modal({
      dismissible: true, // Modal can be dismissed by clicking outside of the modal
      opacity: 0, // Opacity of modal background
      inDuration: 300, // Transition in duration
      outDuration: 200, // Transition out duration
      startingTop: '4%', // Starting top style attribute
      endingTop: '10%', // Ending top style attribute
      preventScrolling: true
          }
  );
  
   function popupWindow(url, title) {      
                    window.open(url , title);        
                   }     
                </script>
                   
            </ui:define>

        </ui:composition>

    </body>
</html>
