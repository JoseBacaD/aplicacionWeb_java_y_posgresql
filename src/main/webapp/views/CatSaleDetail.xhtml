<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <body>

        <ui:composition template="./parentTemplate.xhtml">

            <ui:define name="content">
                <p:ajaxStatus  onstart="$('#processing').modal('open');" onsuccess="$('#processing').modal('close');" />

                <f:metadata>
                    <f:event type="preRenderView" listener="#{catSaleDetailBean.onPageLoad}"/>
      </f:metadata>

                <h:form id="searchForm">
                    <h:panelGroup id="panelSearch">
                        <p:focus context="panelSearch" />
                    <div class="row" style="margin-bottom: 0px;" >
                        <div class="col s12">
                            <div class="card hoverable " style="margin-bottom: 0px;" >
                                <div class="card-content">
                                    <h5 style="margin-top: 0px"><i class="icofont-papers "/> Reporte ventas detalle</h5>

                                    <div class="row">
                                              <div class="col s12 m6 l6 input-field">
                                                  
                                                  <p:inputMask id="field3"
                                                               mask="9999/99/99"
                                                               styleClass="datepicker"
                                                               value="#{catSaleDetailBean.
                                                                        saleDetExt.
                                                                        abstractField1.
                                                                        dateIniValue}" 
                                                               converterMessage="Fecha inválida"
                                                               converter="EmptyToNullConverter">
                                                    <f:convertDateTime pattern="yyyy/MM/dd" />
                                                    </p:inputMask>
                                          <p:watermark  value="AAAA/MM/DD" for="field3" />
                                          <h:messages class="red-text" for="field3"/>
                                          <label for="field3">Fecha venta inicio</label>
                                        </div>
                                        
                                        <div class="col s12 m6 l6 input-field">
                                           <p:inputMask id="field4"
                                                        mask="9999/99/99"
                                                        styleClass="datepicker"
                                                        value="#{catSaleDetailBean.
                                                                        saleDetExt.
                                                                        abstractField1.
                                                                        dateEndValue}" 
                                                        converterMessage="Fecha inválida"
                                                        converter="EmptyToNullConverter"
                                                        >
                                                        
                                               <f:convertDateTime pattern="yyyy/MM/dd" />
                                         </p:inputMask>
                                          <p:watermark  value="AAAA/MM/DD" for="field4" />
                                          <h:messages class="red-text" for="field4"/>
                                          <label for="field7">Fecha venta final</label>
                                        </div>
                                        
                                        
                                       
                                        </div>
                                   
                                    
                                    

                                    <div class="row">
                                        <div class="col s12 m4 l4 offset-l4 offset-m4 " >                        
                                            <p:commandLink action="#{catSaleDetailBean.populateTable}"
                                                           styleClass="btn waves-effect waves-light"
                                                           style="width: 100%; text-decoration: none;
                                                                  color: white;"
                                                           update="tableForm"
                                                           
                                                           ajax="true"
                                                           oncomplete="updateInputs();
                                                                       initDatepicker();
                                                                       initSelect();"
                                                                       >
                                                
                                                <i class="icofont-search"></i> #{bundle['search.btn.search']}
                                            
                                            </p:commandLink> 
                                        </div>



                                    </div>
                                </div>
                            </div>

                        </div>

                    </div>

                 </h:panelGroup>
                </h:form>


                <h:form id="tableForm">
                    <div class="row" style="margin-bottom: 0px;">
                        <div class="col s12">
                            <div class="card ">
                                <div class="card-content">
                                    
                                        

                                       <div class="col s4 offset-m10 offset-l11 offset-s8" style="margin-bottom: 5px">
                                        <h:commandLink styleClass="">
                                            <p:dataExporter type="xls" target="resultTable" fileName="reporte_ventas_detall_#{catSaleDetailBean.strDateToday}" pageOnly="false"/>
                                            <i class="fas fa-file-download fa-2x light-blue-text text-darken-4">
                                            </i>
                                        </h:commandLink>
                                           
                                           <p:commandLink styleClass=""
                                                          actionListener="#{catSaleDetailBean.printSaleDetail}"
                                                          onsuccess="updateInputs();">
                                            <i class="fas fa-print fa-2x light-blue-text text-darken-4" style="margin-top: 5px"></i>
                                            
                                        </p:commandLink>
                                       </div>


                                    <div class="row" style="margin-bottom: 8px" >
                                        <div class="col s12">
                                   
                                            <p:dataTable id="resultTable" 
                                                         styleClass="table table-hover"
                                                         value="#{catSaleDetailBean.objLazyList}"
                                                         var="row"
                                                         emptyMessage="#{bundle['resulttable.nomatchfound']}"
                                                         tableStyle="table-layout:auto;"
                                                         reflow="true"
                                                         paginator="true" rows="20"
                                                         lazy="true"
                                                         currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} registros"
                                                         rowsPerPageTemplate="20,50,100,{ShowAll|'Todos'}"
                                                         paginatorTemplate="{CurrentPageReport}
                                                         {FirstPageLink}
                                                         {PreviousPageLink}
                                                         {PageLinks}
                                                         {NextPageLink}
                                                         {LastPageLink}
                                                         {RowsPerPageDropdown}">       
   
                                                <p:column headerText="No. folio">                                                   
                                                    <h:outputText value="#{row.folio.folio}" />
                                                </p:column>
                                                <p:column headerText="Código">
                                                    <h:outputText value="#{row.standardCodeItem.standardCodeItem}" />
                                                </p:column>
                                                <p:column headerText="Descripción">                                                  
                                                    <h:outputText value="#{row.standardCodeItem.descItem}" />
                                                </p:column>
                                                 <p:column headerText="Cantidad">                                                  
                                                    <h:outputText value="#{row.quantity}" />
                                                </p:column>
                                                
                                                <p:column headerText="Precio">                                                 
                                                    <h:outputText value="#{row.priceDetail}" />
                                                </p:column>
                                               
                                                <p:column headerText="Impuesto">                                                 
                                                    <h:outputText value="#{row.itemTax}" />
                                                </p:column>
                                                
                                                <p:column headerText="Fecha venta">                                                    
                                                    <h:outputText value="#{row.saleDate}" >
                                                        <f:convertDateTime type="date" pattern="yyyy-MM-dd HH:mm"/>
                                                    </h:outputText>
                                                </p:column>
                                                
                                                
                                              


                                            </p:dataTable>
                                        </div>
                                         </div>
                                        
                                    
<!--                                        <h:commandLink styleClass="btn-floating blue lighten-1">
                                            <p:dataExporter type="text" target="resultTable" fileName="reporteXML" pageOnly="false" />
                                            <i class="icofont-file-text" style="margin-top: 5px"></i>
                                        </h:commandLink>-->
                                    <div class="row">
                                        <div class="col s4 offset-m10 offset-l11 offset-s8" style="margin-bottom: 5px; padding-left: 0px;">
                                            <h:commandLink styleClass="">
                                            <p:dataExporter type="xls" target="resultTable" fileName="reporte_ventas_detalle_#{catSaleDetailBean.strDateToday}" pageOnly="false"/>
                                            <i class="fas fa-file-download fa-2x light-blue-text text-darken-4">
                                            </i>
                                        </h:commandLink>
                                            
                                            <p:commandLink styleClass=""
                                                          actionListener="#{catSaleDetailBean.printSaleDetail}"
                                                          onsuccess="updateInputs();">
                                            <i class="fas fa-print fa-2x light-blue-text text-darken-4" style="margin-top: 5px"></i>
                                        </p:commandLink>
                                        </div>
                                    </div>
                                </div>


                            </div>
                        </div>
                    </div>    







                </h:form>
                
                
                <h:panelGroup id="panelWarning">
                    <p:focus context="panelWarning"/>
                <div id="warningModal" class="modal">
                    <div class="modal-content center-align black-text ">

                        <h5>#{bundle['modal.delete.tittle']}</h5>
                        <h6>#{bundle['modal.delete.question']}</h6>

                    </div>
                    <div class="modal-footer">
                        <div class="row" style="margin-left: 2px;">

                            <div class="col s12 m5 l5  offset-l1 offset-m1 center-align">
                                <h:form  id="warningForm">
                                    <p:commandLink style="width: 100%; text-decoration: none;
                                                                  color: white;"
                                                   action="#{catSaleDetailBean.callDelete}"
                                                   styleClass="btn waves-effect waves-light"
                                                   onsuccess="$('#warningModal').modal('close'); $('#answerModal').modal('open');"
                                                   update="tableForm finishedProcessPanel"


                                                   >

                                        <i class="fa fa-check"></i>    Aceptar
                                    </p:commandLink>
                                </h:form>
                            </div>
                            <div class="col s12 m5 l5 center-align">
                                <a class="btn waves-effect waves-light modal-action modal-close" style="width: 100%;">
                                    <i class="icofont-close-line"/>
                                    Cancelar
                                </a>
                            </div>
                        </div>
                    </div>

                </div>
                    </h:panelGroup>

                <div id="answerModal" class="modal">
                    <h:panelGroup id="finishedProcessPanel">
                        <div class="modal-content center-align black-text">
                            <h5>#{bundle['modal.updtcreate.confirm']}</h5>

                            <h6></h6>
                        </div>
                        <div class="modal-footer">
                            <div class="row" style="width: 99%;margin-left: 0px">
                                <div class="col s12 m6 l6 offset-m3 offset-l3">
                                    <a class="modal-action modal-close waves-effect waves-light btn" style="width: 100%;"><i class="icofont-check-alt"></i> Aceptar</a>  
                                </div>
                            </div>
                        </div>
                    </h:panelGroup>
                </div>
                               <script>
     initModal();
    function initModal(){
            $(document).ready(function () {
                // the "href" attribute of .modal-trigger must specify the modal ID that wants to be triggered
                $('#processing').modal({
      dismissible: false, // Modal can be dismissed by clicking outside of the modal
      opacity: 0, // Opacity of modal background
      inDuration: 300, // Transition in duration
      outDuration: 200, // Transition out duration
      startingTop: '4%', // Starting top style attribute
      endingTop: '10%', // Ending top style attribute
      preventScrolling: true
          }
  );
            });
            
            
}

function popupWindow(url, title) {      
    window.open(url , title);        
}    

function downloadTicket(uri, name) 
{
    var link = document.createElement("a");
    // If you don't know the name or want to use
    // the webserver default set name = ''
    link.setAttribute('download', name);
    link.href = uri;
    document.body.appendChild(link);
    link.click();
    link.remove();
}
                </script>
                
                
            </ui:define>

        </ui:composition>

        
    </body>
</html>
